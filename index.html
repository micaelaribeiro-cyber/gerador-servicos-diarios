<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Gerador de Serviços Diários</title>
<style>
:root{--paper:#e8edef;--ink:#11252c;--teal:#0a5560;--line:#b9c6cb;--signal:#e0531f;--ok:#1b7f4b;--err:#a3201a}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:40px 20px 64px}
h1{margin:0 0 8px;font-size:clamp(1.6rem,4vw,2.3rem);letter-spacing:.02em;color:var(--teal);font-weight:800}
.lead{margin:0 0 28px;max-width:62ch}
.drop{display:flex;flex-direction:column;gap:4px;padding:34px 24px;background:#fff;border:2px dashed var(--teal);border-radius:6px;text-align:center;cursor:pointer}
.drop:hover,.drop.over,.drop:focus-within{background:#f3fafb;border-style:solid}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop span{font-size:.9rem;color:#4a6068}
.actions{display:flex;align-items:center;gap:16px;margin:20px 0}
.primary{display:inline-block;border:0;border-radius:4px;background:var(--signal);color:#fff;font:700 1rem inherit;font-family:inherit;padding:14px 26px;cursor:pointer;text-decoration:none;letter-spacing:.03em}
.primary:disabled{background:#9aa9ae;cursor:not-allowed}
.primary:focus-visible,.drop:focus-within{outline:3px solid var(--teal);outline-offset:2px}
.busy{display:flex;align-items:center;gap:8px}
.busy i{width:16px;height:16px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.busy i{animation-duration:3s}}
.msg{margin:0 0 16px;font-weight:600}.ok{color:var(--ok)}.error{color:var(--err);background:#fff;border-left:4px solid var(--err);padding:10px 14px}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 24px}
.totals div{background:#fff;padding:14px 16px;border-radius:6px}
.totals dt{font-size:.85rem;color:#4a6068}.totals dd{margin:0;font-size:1.9rem;font-weight:800;color:var(--teal)}
.locs{list-style:none;margin:0 0 20px;padding:0;background:#fff;border-radius:6px}
.locs li{display:grid;grid-template-columns:150px 1fr 48px;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--paper)}
.locs li:last-child{border:0}
.locs .bar{height:10px;background:var(--paper);border-radius:5px;overflow:hidden}
.locs .bar b{display:block;height:100%;background:var(--teal)}
.locs .n{text-align:right;font-weight:700}
.notes{margin:0 0 24px;padding-left:20px;font-size:.92rem}
.dl{margin-top:4px}
@media (max-width:560px){.totals{grid-template-columns:1fr}.locs li{grid-template-columns:110px 1fr 40px}}

</style>
</head>
<body>
<main>
  <h1>GERADOR DE SERVIÇOS DIÁRIOS</h1>
  <p class="lead">Selecione o relatório de OS e baixe a programação separada por localidade. O arquivo é processado neste navegador e não é enviado a lugar nenhum.</p>

  <label id="drop" class="drop" for="file">
    <input id="file" type="file" accept=".xls,.xlsx,.xlsm">
    <strong id="fname">Arraste o relatório aqui ou clique para selecionar</strong>
    <span>Formatos aceitos: .xls e .xlsx</span>
  </label>

  <div class="actions">
    <button id="gerar" class="primary" disabled>GERAR PROGRAMAÇÃO</button>
    <span id="busy" class="busy" hidden><i></i>Processando…</span>
  </div>

  <p id="error" class="msg error" role="alert" hidden></p>

  <section id="result" hidden>
    <p class="msg ok" id="done"></p>
    <dl class="totals">
      <div><dt>OS analisadas</dt><dd id="t-all"></dd></div>
      <div><dt>Retiradas excluídas</dt><dd id="t-rem"></dd></div>
      <div><dt>OS aproveitadas</dt><dd id="t-kept"></dd></div>
    </dl>
    <ul id="locs" class="locs"></ul>
    <ul id="notes" class="notes"></ul>
    <a id="download" class="primary dl" href="#" download>BAIXAR EXCEL</a>
  </section>
</main>
<!-- Biblioteca Excel carregada de CDN pública; os dados da planilha não são enviados para ela. -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.min.js"></script>
<script>
/* Lógica de processamento (sem dependência de biblioteca). Roda no navegador e no Node (testes). */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Processor = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const SHEETS = ['Cidades Externas', 'Itabatã', 'Mucuri', 'Nova Viçosa', 'Posto da Mata', 'Nanuque', 'Serra dos Aimorés'];
  const EXTERNAS = SHEETS[0];
  const LOCAL = { itabata: 'Itabatã', mucuri: 'Mucuri', 'nova vicosa': 'Nova Viçosa', 'posto da mata': 'Posto da Mata', nanuque: 'Nanuque', 'serra dos aimores': 'Serra dos Aimorés' };
  const FMT_DT = 'dd/mm/yyyy hh:mm', FMT_D = 'dd/mm/yyyy';

  // Ordem final das colunas (A..N) e nomes aceitos no relatório original (já normalizados).
  const COLS = [
    { key: 'filial', label: 'Filial', aliases: ['filial'] },
    { key: 'abertura', label: 'Abertura', type: 'date', aliases: ['abertura', 'data abertura', 'data de abertura'] },
    { key: 'status', label: 'Status', aliases: ['status', 'situacao'] },
    { key: 'agendamento', label: 'Agendamento', type: 'date', aliases: ['agendamento', 'data agendamento', 'data de agendamento', 'data agenda'] },
    { key: 'cliente', label: 'Cliente', aliases: ['cliente', 'nome cliente', 'nome do cliente', 'razao social'] },
    { key: 'assunto', label: 'Assunto', aliases: ['assunto'] },
    { key: 'colaborador', label: 'Colaborador', aliases: ['colaborador', 'tecnico'] },
    { key: 'endereco', label: 'Endereço', aliases: ['endereco', 'logradouro'] },
    { key: 'complemento', label: 'Complemento', aliases: ['complemento'] },
    { key: 'bairro', label: 'Bairro', aliases: ['bairro'] },
    { key: 'celular', label: 'Telefone celular', type: 'phone', aliases: ['telefone celular', 'celular', 'tel celular'] },
    { key: 'whatsapp', label: 'Whatsapp', type: 'phone', aliases: ['whatsapp', 'whats app'] },
    { key: 'residencial', label: 'Telefone residencial', type: 'phone', aliases: ['telefone residencial', 'tel residencial', 'telefone fixo'] },
    { key: 'comercial', label: 'Telefone comercial', type: 'phone', aliases: ['telefone comercial', 'tel comercial'] }
  ];

  // Minúsculas, sem acentos, sem pontuação, espaços únicos.
  const norm = v => String(v == null ? '' : v).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

  function mapColumns(cells) {
    const normed = cells.map(norm), used = new Set(), map = {};
    COLS.forEach(c => {
      let idx = -1;
      for (const a of c.aliases) {
        idx = normed.findIndex((x, j) => x === a && !used.has(j));
        if (idx >= 0) break;
      }
      if (idx >= 0) used.add(idx);
      map[c.key] = idx;
    });
    return map;
  }

  function detectHeader(rows) {
    let best = null;
    for (let r = 0; r < Math.min(rows.length, 40); r++) {
      const map = mapColumns(rows[r] || []);
      const n = Object.values(map).filter(i => i >= 0).length;
      if (n >= 3 && (!best || n > best.n)) best = { row: r, map, n };
    }
    return best;
  }

  // Converte número serial do Excel, Date ou texto (dd/mm/aaaa [hh:mm[:ss]] ou aaaa-mm-dd) em serial.
  function toSerial(v) {
    if (typeof v === 'number') return v >= 1 && v < 2958466 ? v : null;
    if (v instanceof Date && !isNaN(v)) return Date.UTC(v.getFullYear(), v.getMonth(), v.getDate(), v.getHours(), v.getMinutes(), v.getSeconds()) / 864e5 + 25569;
    if (typeof v !== 'string') return null;
    const s = v.trim();
    let m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})(?:[ T,]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/), d, mo, y;
    if (m) { d = +m[1]; mo = +m[2]; y = +m[3]; }
    else if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
    else return null;
    if (y < 100) y += 2000;
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    return Date.UTC(y, mo - 1, d, +(m[4] || 0), +(m[5] || 0), +(m[6] || 0)) / 864e5 + 25569;
  }

  function makeCell(v, col) {
    if (v == null || v === '') return null;
    if (col.type === 'date') {
      const s = toSerial(v);
      if (s == null) return { t: 's', v: String(v) }; // não inventa: mantém o texto original
      return { t: 'n', v: s, z: s - Math.floor(s) > 1e-6 ? FMT_DT : FMT_D };
    }
    if (typeof v === 'number') return col.type === 'phone' ? { t: 's', v: String(v) } : { t: 'n', v };
    if (typeof v === 'boolean') return { t: 'b', v };
    return { t: 's', v: String(v) };
  }

  const isRetirada = assunto => /\bretirada\b/.test(norm(assunto));

  function processRows(rows) {
    const hdr = detectHeader(rows);
    if (!hdr) throw new Error('Não encontrei a linha de cabeçalhos (Assunto, Complemento, Cliente...). Confira se o arquivo é o relatório de OS.');
    const map = hdr.map;
    if (map.assunto < 0) throw new Error('A coluna "Assunto" não foi encontrada no relatório.');
    if (map.complemento < 0) throw new Error('A coluna "Complemento" não foi encontrada no relatório.');

    const sheets = {}, srcIdx = {};
    SHEETS.forEach(n => { sheets[n] = []; srcIdx[n] = []; });
    const removedSubjects = {};
    let analyzed = 0, removed = 0;

    for (let i = hdr.row + 1; i < rows.length; i++) {
      const row = rows[i] || [];
      if (row.every(c => c === '' || c == null)) continue;
      analyzed++;
      const assunto = row[map.assunto];
      if (isRetirada(assunto)) {
        removed++;
        const k = String(assunto).trim();
        removedSubjects[k] = (removedSubjects[k] || 0) + 1;
        continue;
      }
      const rec = COLS.map(c => (map[c.key] >= 0 ? makeCell(row[map[c.key]], c) : null));
      const dest = LOCAL[norm(row[map.complemento])] || EXTERNAS;
      if (dest !== EXTERNAS) rec[8] = { t: 's', v: dest }; // complemento padronizado
      sheets[dest].push(rec);
      srcIdx[dest].push(i);
    }

    const val = (rec, i) => (rec[i] ? rec[i].v : '');
    SHEETS.forEach(n => sheets[n].sort((a, b) => {
      const sa = a[3] && a[3].t === 'n' ? a[3].v : Infinity, sb = b[3] && b[3].t === 'n' ? b[3].v : Infinity;
      return (sa === sb ? 0 : sa < sb ? -1 : 1) || String(val(a, 6)).localeCompare(String(val(b, 6)), 'pt-BR') || String(val(a, 4)).localeCompare(String(val(b, 4)), 'pt-BR');
    }));

    const perSheet = {};
    let kept = 0;
    SHEETS.forEach(n => { perSheet[n] = sheets[n].length; kept += sheets[n].length; });
    const all = [].concat(...SHEETS.map(n => srcIdx[n]));
    const integrity = { ok: kept === analyzed - removed && new Set(all).size === all.length };

    const warnings = [];
    const missing = COLS.filter(c => map[c.key] < 0).map(c => c.label);
    if (missing.length) warnings.push('Colunas não encontradas no relatório (ficaram em branco): ' + missing.join(', ') + '.');
    const seen = new Map();
    SHEETS.forEach(n => sheets[n].forEach(r => { const k = JSON.stringify(r); seen.set(k, (seen.get(k) || 0) + 1); }));
    const dup = [...seen.values()].filter(c => c > 1).reduce((a, c) => a + c, 0);
    if (dup) warnings.push(dup + ' linhas são idênticas a outra linha do relatório (todas as colunas). Foram mantidas.');

    const usedCols = new Set(Object.values(map));
    const unused = (rows[hdr.row] || []).map((h, j) => (!usedCols.has(j) && String(h).trim() ? String(h).trim() : null)).filter(Boolean);

    return { map, headerRow: hdr.row, sheets, stats: { analyzed, removed, kept, perSheet }, removedSubjects, warnings, unused, integrity };
  }

  const HEADER_STYLE = {
    font: { bold: true, color: { rgb: 'FFFFFF' } },
    fill: { patternType: 'solid', fgColor: { rgb: '0A5560' } },
    alignment: { horizontal: 'center', vertical: 'center', wrapText: true },
    border: { bottom: { style: 'medium', color: { rgb: 'E0531F' } } }
  };
  const letter = i => String.fromCharCode(65 + i);

  function buildSheet(records) {
    const ws = {}, widths = COLS.map(c => c.label.length + 4);
    COLS.forEach((c, i) => { ws[letter(i) + '1'] = { t: 's', v: c.label, s: HEADER_STYLE }; });
    records.forEach((rec, r) => rec.forEach((cell, i) => {
      if (!cell) return;
      ws[letter(i) + (r + 2)] = cell;
      widths[i] = Math.max(widths[i], (cell.z ? 17 : String(cell.v).length) + 2);
    }));
    const ref = 'A1:N' + (records.length + 1);
    ws['!ref'] = ref;
    ws['!cols'] = widths.map(w => ({ wch: Math.min(w, 50) }));
    ws['!autofilter'] = { ref };
    ws['!freeze'] = { xSplit: '0', ySplit: '1', topLeftCell: 'A2', activePane: 'bottomLeft', state: 'frozen' };
    return ws;
  }

  function buildWorkbook(result) {
    const wb = { SheetNames: SHEETS.slice(), Sheets: {} };
    SHEETS.forEach(n => { wb.Sheets[n] = buildSheet(result.sheets[n]); });
    return wb;
  }

  return { SHEETS, COLS, norm, toSerial, processRows, buildWorkbook };
});

</script>
<script>
/* Interface. Todo o processamento ocorre localmente; nenhum dado é enviado. */
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const CDN_URLS = [
    'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js',
    'https://unpkg.com/xlsx-js-style@1.2.0/dist/xlsx.bundle.js'
  ]; // alternativas caso uma CDN esteja indisponível
  let file = null, url = null;

  function loadXlsx() {
    if (window.XLSX) return Promise.resolve();
    return new Promise(async (resolve, reject) => {
      for (const src of CDN_URLS) {
        try {
          await new Promise((ok, fail) => {
            const script = document.createElement('script');
            script.src = src;
            script.onload = () => window.XLSX ? ok() : fail(new Error('Biblioteca não inicializou'));
            script.onerror = () => fail(new Error('Falha ao acessar ' + new URL(src).host));
            document.head.appendChild(script);
          });
          resolve();
          return;
        } catch (_) { /* tenta a próxima CDN */ }
      }
      reject(new Error('Não foi possível carregar a biblioteca Excel. Verifique a conexão ou peça à equipe de TI a liberação de cdn.jsdelivr.net e unpkg.com.'));
    });
  }
  const showError = m => { $('error').textContent = m; $('error').hidden = !m; };
  function setFile(f) {
    showError(''); $('result').hidden = true;
    if (!f) return;
    if (!/\.(xls|xlsx|xlsm)$/i.test(f.name)) return showError('Selecione um arquivo .xls ou .xlsx.');
    file = f; $('fname').textContent = f.name; $('gerar').disabled = false;
  }
  $('file').addEventListener('change', e => setFile(e.target.files[0]));
  const dz = $('drop');
  ['dragenter', 'dragover'].forEach(t => dz.addEventListener(t, e => { e.preventDefault(); dz.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(t => dz.addEventListener(t, e => { e.preventDefault(); dz.classList.remove('over'); }));
  dz.addEventListener('drop', e => setFile(e.dataTransfer.files[0]));

  function li(parent, text) { const x = document.createElement('li'); x.textContent = text; parent.appendChild(x); return x; }

  function render(r, name) {
    const st = r.stats;
    $('done').textContent = 'Programação gerada com sucesso.';
    $('t-all').textContent = st.analyzed; $('t-rem').textContent = st.removed; $('t-kept').textContent = st.kept;
    const locs = $('locs'); locs.textContent = '';
    const max = Math.max(1, ...Object.values(st.perSheet));
    Processor.SHEETS.forEach(n => {
      const x = document.createElement('li'), a = document.createElement('span'), bar = document.createElement('span'), b = document.createElement('b'), c = document.createElement('span');
      a.textContent = n; bar.className = 'bar'; b.style.width = (st.perSheet[n] / max * 100) + '%'; bar.appendChild(b);
      c.className = 'n'; c.textContent = st.perSheet[n];
      x.append(a, bar, c); locs.appendChild(x);
    });
    const notes = $('notes'); notes.textContent = '';
    li(notes, r.integrity.ok ? 'Conferência: a soma das abas é igual às OS aproveitadas e nenhuma OS aparece em duas abas.' : 'ATENÇÃO: a conferência de totais falhou. Não use este arquivo.');
    const rs = Object.entries(r.removedSubjects);
    if (rs.length) li(notes, 'Assuntos excluídos: ' + rs.map(([k, v]) => k + ' (' + v + ')').join(', ') + '.');
    r.warnings.forEach(w => li(notes, w));
    if (r.unused.length) li(notes, 'Colunas do relatório não utilizadas: ' + r.unused.join(', ') + '.');
    $('result').hidden = false;
  }

  $('gerar').addEventListener('click', async () => {
    showError(''); $('result').hidden = true; $('gerar').disabled = true; $('busy').hidden = false;
    try {
      await loadXlsx();
      await new Promise(r => setTimeout(r, 30));
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
      let result = null, err = null;
      for (const n of wb.SheetNames) {
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '', blankrows: false });
        try { result = Processor.processRows(rows); break; } catch (e) { err = e; }
      }
      if (!result) throw err || new Error('Planilha vazia.');
      const buf = XLSX.write(Processor.buildWorkbook(result), { bookType: 'xlsx', type: 'array' });
      if (url) URL.revokeObjectURL(url);
      url = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
      const d = new Date(), p = n => String(n).padStart(2, '0');
      const a = $('download'); a.href = url; a.download = 'PROGRAMACAO_' + p(d.getDate()) + '-' + p(d.getMonth() + 1) + '-' + d.getFullYear() + '.xlsx';
      render(result);
    } catch (e) { showError('Erro: ' + e.message); }
    finally { $('busy').hidden = true; $('gerar').disabled = false; }
  });
})();

</script>
</body>
</html>
